<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Minimal Board</h1>
            <div id="auth-status"></div>
        </div>

        <!-- List Page -->
        <div id="list-page">
            <div class="nav-buttons" style="margin-bottom: 20px;">
                <button onclick="showWrite()">새 글 작성</button>
                <button class="secondary" onclick="loadPosts()">새로고침</button>
            </div>
            <div id="post-list">
                <!-- Posts will be injected here -->
            </div>
        </div>

        <!-- Detail Page -->
        <div id="detail-page" class="hidden">
            <div id="detail-content"></div>
            <div class="comment-section">
                <h3>댓글</h3>
                <div id="comment-list"></div>
                <div style="margin-top: 15px;">
                    <input type="text" id="comment-input" placeholder="댓글을 입력하세요...">
                    <button id="comment-btn">댓글 등록</button>
                </div>
            </div>
        </div>

        <!-- Write Page -->
        <div id="write-page" class="hidden">
            <h2>새 글 작성</h2>
            <input type="text" id="title-input" placeholder="제목을 입력하세요">
            <textarea id="content-input" placeholder="내용을 입력하세요"></textarea>
            <div class="nav-buttons">
                <button onclick="createPost()">작성 완료</button>
                <button class="secondary" onclick="loadPosts()">취소</button>
            </div>
        </div>

        <!-- Auth Page -->
        <div id="auth-page" class="hidden">
            <h2>로그인 / 회원가입</h2>
            <input type="text" id="auth-username" placeholder="아이디">
            <input type="password" id="auth-password" placeholder="비밀번호">
            <label style="display: block; margin-bottom: 15px;">
                <input type="checkbox" id="auth-auto" style="width: auto; margin-bottom: 0;"> 자동 로그인
            </label>
            <div class="nav-buttons">
                <button onclick="handleAuth('login')">로그인</button>
                <button class="secondary" onclick="handleAuth('register')">회원가입</button>
                <button class="secondary" onclick="loadPosts()">취소</button>
            </div>
        </div>
    </div>

    <script src="../dist/public/src/app.js"></script>
</body>
</html>
